# OpenTelemetry Collector: one OTLP entry point for all services.
#   traces  -> Tempo (OTLP gRPC)
#   metrics -> Prometheus (scrapes this collector on :8889)
#   logs    -> Loki (native OTLP endpoint)
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch:
    send_batch_size: 2048
    timeout: 2s
  # Metrics only need the service name as a label; the SDK/host attributes would just add noise.
  resource/metrics:
    attributes:
      - { key: telemetry.sdk.name, action: delete }
      - { key: telemetry.sdk.language, action: delete }
      - { key: telemetry.sdk.version, action: delete }
      - { key: service.namespace, action: delete }

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
    enable_open_metrics: true   # exposes exemplars (metric -> trace links)
    metric_expiration: 10m

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/metrics, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
