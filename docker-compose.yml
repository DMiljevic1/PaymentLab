# PaymentLab - all services. Start with ./lab.ps1 up
# Resource limits and tuning knobs come from .env (see there).
#
# Services talk to their dependencies THROUGH toxiproxy (ports 15432, 25432, 35672/35673, 18082, 18090),
# so network faults can be injected without code changes. Host ports below are for you (psql, UI, Swagger).

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

# OpenTelemetry SDK settings shared by all application services (traces, metrics, logs -> collector)
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=lab

services:
  # ------------------------------------------------------------------ edge
  gateway:
    build:
      context: ./src/dotnet
      args: { PROJECT: Gateway }
    image: paymentlab/gateway:local
    environment:
      <<: *otel-env
      ReverseProxy__Clusters__payments__Destinations__payments__Address: http://payments:8080/
      ReverseProxy__Clusters__wallet__Destinations__wallet__Address: http://wallet:8080/
      RateLimit__TokenLimit: ${GATEWAY_RATE_LIMIT}
      RateLimit__TokensPerSecond: ${GATEWAY_RATE_LIMIT}
    ports: ["8080:8080"]
    depends_on: [payments, wallet]
    healthcheck: &dotnet-health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "${GATEWAY_CPUS}", memory: "${GATEWAY_MEM}" }
    logging: *logging
    restart: unless-stopped

  # ------------------------------------------------------------------ services
  payments:
    build:
      context: ./src/dotnet
      args: { PROJECT: Payments }
    image: paymentlab/payments:local
    environment:
      <<: *otel-env
      ConnectionStrings__Payments: "Host=toxiproxy;Port=15432;Database=payments;Username=payments;Password=payments;Maximum Pool Size=${PAYMENTS_DB_POOL};Application Name=payments"
      Wallet__BaseUrl: http://toxiproxy:18082
      RabbitMq__Host: toxiproxy
      RabbitMq__Port: "35672"
      RabbitMq__Prefetch: ${PAYMENTS_PREFETCH}
    ports: ["8081:8080"]
    depends_on:
      payments-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      toxiproxy: { condition: service_started }
    healthcheck: *dotnet-health
    deploy:
      resources:
        limits: { cpus: "${PAYMENTS_CPUS}", memory: "${PAYMENTS_MEM}" }
    logging: *logging
    restart: unless-stopped

  wallet:
    build:
      context: ./src/dotnet
      args: { PROJECT: Wallet }
    image: paymentlab/wallet:local
    environment:
      <<: *otel-env
      ConnectionStrings__Wallet: "Host=toxiproxy;Port=25432;Database=wallet;Username=wallet;Password=wallet;Maximum Pool Size=${WALLET_DB_POOL};Application Name=wallet"
    ports: ["8082:8080"]
    depends_on:
      wallet-db: { condition: service_healthy }
      toxiproxy: { condition: service_started }
    healthcheck: *dotnet-health
    deploy:
      resources:
        limits: { cpus: "${WALLET_CPUS}", memory: "${WALLET_MEM}" }
    logging: *logging
    restart: unless-stopped

  connector:
    build:
      context: ./src/go/connector
      dockerfile: ../Dockerfile
      args: { MAIN: ./cmd/connector }
    image: paymentlab/connector:local
    environment:
      <<: *otel-env
      AMQP_URL: amqp://lab:lab@toxiproxy:35673/
      BANK_URL: http://toxiproxy:18090
      PREFETCH: ${CONNECTOR_PREFETCH}
      BANK_TIMEOUT_MS: "5000"
      MAX_ATTEMPTS: "5"
      RETRY_DELAY_MS: "5000"
    ports: ["8085:8080"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      toxiproxy: { condition: service_started }
    healthcheck: &go-health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "${CONNECTOR_CPUS}", memory: "${CONNECTOR_MEM}" }
    logging: *logging
    restart: unless-stopped

  fakebank:
    build:
      context: ./src/go/fakebank
      dockerfile: ../Dockerfile
      args: { MAIN: . }
    image: paymentlab/fakebank:local
    environment:
      <<: *otel-env
      FAKEBANK_LATENCY_MS: ${FAKEBANK_LATENCY_MS}
      FAKEBANK_JITTER_MS: ${FAKEBANK_JITTER_MS}
      FAKEBANK_REJECT_RATE: ${FAKEBANK_REJECT_RATE}
    ports: ["8090:8080"]
    healthcheck: *go-health
    deploy:
      resources:
        limits: { cpus: "${FAKEBANK_CPUS}", memory: "${FAKEBANK_MEM}" }
    logging: *logging
    restart: unless-stopped

  # ------------------------------------------------------------------ infrastructure
  payments-db:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - max_connections=${PG_MAX_CONNECTIONS}
      - -c
      - shared_buffers=${PAYMENTS_DB_SHARED_BUFFERS}
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
    ports: ["5432:5432"]
    volumes:
      - payments-db-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256m
    deploy:
      resources:
        limits: { cpus: "${PAYMENTS_DB_CPUS}", memory: "${PAYMENTS_DB_MEM}" }
    logging: *logging
    restart: unless-stopped

  wallet-db:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - max_connections=${PG_MAX_CONNECTIONS}
      - -c
      - shared_buffers=${WALLET_DB_SHARED_BUFFERS}
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
    ports: ["5433:5432"]
    volumes:
      - wallet-db-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256m
    deploy:
      resources:
        limits: { cpus: "${WALLET_DB_CPUS}", memory: "${WALLET_DB_MEM}" }
    logging: *logging
    restart: unless-stopped

  rabbitmq:
    image: ${RABBITMQ_IMAGE}
    hostname: rabbitmq
    environment:
      # RabbitMQ does not see the container memory limit; tell it, so its memory alarm (60%) fires before an OOM kill.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbit total_memory_available_override_value "${RABBITMQ_MEM}"'
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "${RABBITMQ_CPUS}", memory: "${RABBITMQ_MEM}" }
    logging: *logging
    restart: unless-stopped

  toxiproxy:
    image: ${TOXIPROXY_IMAGE}
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    ports: ["8474:8474"]
    volumes:
      - ./infra/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    deploy:
      resources:
        limits: { cpus: "${TOXIPROXY_CPUS}", memory: "${TOXIPROXY_MEM}" }
    logging: *logging
    restart: unless-stopped

  # ------------------------------------------------------------------ observability
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE}
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    deploy:
      resources:
        limits: { cpus: "${OTEL_COLLECTOR_CPUS}", memory: "${OTEL_COLLECTOR_MEM}" }
    logging: *logging
    restart: unless-stopped

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION}
      - --web.enable-remote-write-receiver   # Tempo metrics generator + k6
      - --enable-feature=exemplar-storage
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    deploy:
      resources:
        limits: { cpus: "${PROMETHEUS_CPUS}", memory: "${PROMETHEUS_MEM}" }
    logging: *logging
    restart: unless-stopped

  loki:
    image: ${LOKI_IMAGE}
    command: ["-config.file=/etc/loki/loki.yaml"]
    environment:
      GOMEMLIMIT: 300MiB
    volumes:
      - ./infra/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports: ["3100:3100"]
    deploy:
      resources:
        limits: { cpus: "${LOKI_CPUS}", memory: "${LOKI_MEM}" }
    logging: *logging
    restart: unless-stopped

  tempo:
    image: ${TEMPO_IMAGE}
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    user: "0"   # the named volume is created root-owned
    environment:
      GOMEMLIMIT: 400MiB   # GC harder before reaching the container limit
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports: ["3200:3200"]
    deploy:
      resources:
        limits: { cpus: "${TEMPO_CPUS}", memory: "${TEMPO_MEM}" }
    logging: *logging
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE}
    environment:
      # Dashboards open without login (anonymous = Viewer). Viewers may also use Explore.
      # Sign in as admin / admin to edit dashboards.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus, loki, tempo]
    deploy:
      resources:
        limits: { cpus: "${GRAFANA_CPUS}", memory: "${GRAFANA_MEM}" }
    logging: *logging
    restart: unless-stopped

  # Exporters connect to the databases directly (not through toxiproxy), so DB metrics stay visible
  # even when the network path between a service and its database is degraded.
  payments-db-exporter:
    image: ${PG_EXPORTER_IMAGE}
    environment:
      DATA_SOURCE_URI: payments-db:5432/payments?sslmode=disable
      DATA_SOURCE_USER: payments
      DATA_SOURCE_PASS: payments
    command: &pg-exporter-args
      - --collector.stat_statements
      - --collector.stat_statements.include_query
      - --collector.stat_statements.query_length=200
      - --collector.long_running_transactions
      - --collector.stat_activity_autovacuum
      - --collector.statio_user_tables
      - --extend.query-path=/etc/pg-exporter/queries.yaml
    volumes: &pg-exporter-volumes
      - ./infra/postgres-exporter/queries.yaml:/etc/pg-exporter/queries.yaml:ro
    depends_on:
      payments-db: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "${PG_EXPORTER_CPUS}", memory: "${PG_EXPORTER_MEM}" }
    logging: *logging
    restart: unless-stopped

  wallet-db-exporter:
    image: ${PG_EXPORTER_IMAGE}
    environment:
      DATA_SOURCE_URI: wallet-db:5432/wallet?sslmode=disable
      DATA_SOURCE_USER: wallet
      DATA_SOURCE_PASS: wallet
    command: *pg-exporter-args
    volumes: *pg-exporter-volumes
    depends_on:
      wallet-db: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "${PG_EXPORTER_CPUS}", memory: "${PG_EXPORTER_MEM}" }
    logging: *logging
    restart: unless-stopped

  # Container CPU / memory / throttling. On Docker Desktop it reads the cgroups of the Linux VM.
  cadvisor:
    image: ${CADVISOR_IMAGE}
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,referenced_memory,resctrl,sched,tcp,udp,disk,diskIO,process
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices:
      - /dev/kmsg
    ports: ["8088:8080"]
    deploy:
      resources:
        limits: { cpus: "${CADVISOR_CPUS}", memory: "${CADVISOR_MEM}" }
    logging: *logging
    restart: unless-stopped

  # ------------------------------------------------------------------ load generator (on demand)
  # Not started by "up"; ./lab.ps1 load runs it with: docker compose --profile load run --rm k6 ...
  k6:
    image: ${K6_IMAGE}
    profiles: ["load"]
    environment:
      BASE_URL: http://gateway:8080
      K6_NO_USAGE_REPORT: "true"
      K6_OTEL_EXPORTER_TYPE: grpc
      K6_OTEL_GRPC_EXPORTER_ENDPOINT: otel-collector:4317
      K6_OTEL_GRPC_EXPORTER_INSECURE: "true"
      K6_OTEL_SERVICE_NAME: k6
      K6_OTEL_METRIC_PREFIX: k6_
      K6_OTEL_EXPORT_INTERVAL: 5s
    volumes:
      - ./load:/load
    working_dir: /load/k6
    deploy:
      resources:
        limits: { cpus: "${K6_CPUS}", memory: "${K6_MEM}" }
    logging: *logging

volumes:
  payments-db-data:
  wallet-db-data:
  rabbitmq-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
